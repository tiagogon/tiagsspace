# branch nxty merged into blwww
if ($request_uri ~ "^/log\-branch/nxty/?(\?.*)?$") { return 301 /log-branch/blwww/$1; }
# the branch index is the Log
if ($request_uri ~ "^/log\-branch/?(\?.*)?$") { return 301 /log/$1; }
# City Series renamed Cidade Series, Nov 2026
if ($request_uri ~ "^/cityburns(/.*|\?.*)?$") { return 301 /cidade$1; }
# Sidewalk became the Log
if ($request_uri ~ "^/sidewalk(/.*|\?.*)?$") { return 301 /log$1; }
# old taxonomy base
if ($request_uri ~ "^/branch(/.*|\?.*)?$") { return 301 /log-branch$1; }
